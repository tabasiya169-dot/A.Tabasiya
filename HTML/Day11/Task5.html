<!DOCTYPE html>
<html>
<head>
    <title>Media Showcase</title>
</head>

<body>

<header>
    <h1 >Media Showcase Webpage</h1>
</header>

<main>

    <section>
        <h2>Image Gallery</h2>

        <img src="assets/image/images_1.jpg" alt="Image 1" width="250" height="180">
        <img src="assets/image/images_2.jpg" alt="Image 2" width="250" height="180">
        <img src="assets/image/images_3.jpg" alt="Image 3" width="250" height="180">
    </section>

    <section>
        <h2>Audio Player</h2>

        <audio controls>
            <source src="assets/audio/audio_1.mpeg" type="audio/mpeg">
        </audio>
    </section>

    <section>
        <h2>Video Player</h2>

        <video controls width="500" height="400" poster="assets/images/poster.jpg">
            <source src="assets/video/video_1.mp4" type="video/mp4">
        </video>
    </section>

    <section>
        <h2>YouTube Video</h2>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/xI-1P9v47SE?si=Hfr2-eWks_uwWjSS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </section>

    <section>
        <h2>Google Map</h2>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.9635174977325!2d80.20188717332772!3d13.037994213422685!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a526752db8ffe35%3A0x7f6a2a2d0ebbdc94!2sSoftlogic!5e0!3m2!1sen!2sin!4v1784811499687!5m2!1sen!2sin" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>

    <section>
        <h2>Embedded PDF</h2>

        <iframe
            src="assets/pdf/pdf1.pdf"
            width="400"
            height="400">
        </iframe>
    </section>

</main>

<footer>
    <p>© 2026 Media Showcase</p>
</footer>

</body>
</html>
