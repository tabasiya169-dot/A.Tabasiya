
<!DOCTYPE html>
<html>
<head>
    <title>Task 2 - Inline Elements</title>
</head>
<body>

<h1>Inline Elements</h1>

<p>
    Once there was a <span>kind boy</span> named <b>Arun</b>.
    He was <strong>honest</strong> and always <em>helped others</em>.
    Read more <a href="#">here</a>.
</p>

<label for="name">Your Name:</label>
<input type="text" id="name" placeholder="Enter your name">

</body>
</html>
