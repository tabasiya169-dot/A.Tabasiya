<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA Institute Admission Form</title>
</head>
<body>
    <center>
    <main>
        <div>
            <h2> SLA Student Registration</h2>
            
                <form >
                    <label for="Fullname">Full name</label>
                    <input type="text" placeholder=" Enter the full name" ><br><br>

                    <label for="email">Email</label>
                    <input type="type" placeholder="Enter the email"><br><br>

                    <label for="Phone number">Phone number</label>
                    <input type="tel"  placeholder="Enter 10 digit" min="10" ><br><br>

                    <label for="gender">Gender</label>
                    <input type="radio" name="Gender" />Male
                    <input type="radio" name="Gender"/>Female 
                    <input type="radio" name="Gender"/>Others<br><br>
                    
                    <label for="Interested course">Interested course</label>
                     <select name="select course" id=" Interested course">
                        <option >JAVA</option>
                         <option >PYTHON</option>
                         <option >DATA ANALYTICS</option>
                   

                     </select><br><br>
                      
                     <label for="Joining date"> Joining date</label>
                     <input type="date" name=" Joining date" id="Joining date"><br><br>

                     <label for="Image">Image</label>
                     <input type="file" name="Image" id="Image"><br><br>

                     <label for="Submit"></label>
                     <input type="submit" name="" id="Submit"><br><br>
                      
                </form>
        </div>
        </center>
    </main>
    
</body>
</html>
