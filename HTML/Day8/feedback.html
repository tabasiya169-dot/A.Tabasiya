<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <center>

<h2>Customer Feedback Form</h2>

<form>

<label for="name">Customer Name:</label><br>
<input type="text" id="name" placeholder="Enter your name"
minlength="3" maxlength="25" required>
<br><br>

<label for="email">Email:</label><br>
<input type="email" id="email"placeholder="Enter your email">
<br><br>

<label>Visit Date:</label><br>
<input type="date">
<br><br>

<label>Service Quality:</label><br>
<input type="radio" name="service"> Excellent
<input type="radio" name="service"> Good
<input type="radio" name="service"> Average
<br><br>

<label>What did you like?</label><br>
<input type="checkbox"> Staff Behaviour<br>
<input type="checkbox"> Service<br>
<input type="checkbox"> Cleanliness
<br><br>

<label>Favourite Color:</label><br>
<input type="color">
<br><br>

<label>Your Suggestions:</label><br>
<textarea rows="5" cols="30"placeholder="Write your feedback"></textarea>
<br><br>

<button type="submit">Send Feedback</button>

<button type="reset">Clear</button><br>

</form>
</center>

</body>
</html>
