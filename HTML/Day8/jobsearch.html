<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>
    <center>

<h2>Job Application Form</h2>

<form>

<label for="fullname">Full Name:</label><br>
<input type="text" id="fullname"placeholder="Enter your full name"
minlength="3" maxlength="30" required>
<br><br>

<label>Email:</label><br>
<input type="email"placeholder="Enter your email">
<br><br>

<label>Phone Number:</label><br>
<input type="tel"placeholder="Enter your phone number">
<br><br>

<label>Date of Birth:</label><br>
<input type="date">
<br><br>

<label>Position Applied For:</label><br>
<select>
<option>Java Developer</option>
<option>Web Developer</option>
<option>UI Designer</option>
<option>Software Tester</option>
</select>
<br><br>

<label>Experience Level:</label><br>
<input type="radio" name="exp"> Fresher
<input type="radio" name="exp"> Experienced
<br><br>

<label>Skills:</label><br>
<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> Java
<input type="checkbox"> SQL
<br><br>

<label>Upload Resume:</label><br>
<input type="file">
<br><br>

<label>Portfolio URL:</label><br>
<input type="url"placeholder="https://example.com">
<br><br>

<label>Available Time:</label><br>
<input type="time">
<br><br>

<label>Cover Letter:</label><br>
<textarea rows="5" cols="30"placeholder="Write about yourself"></textarea>
<br><br>

<button type="submit">Apply Now</button>

<button type="reset">Reset</button>

</form>
</center>

</body>
</html>
