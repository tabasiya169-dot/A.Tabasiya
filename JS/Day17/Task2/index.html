<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        form {
            width: 300px;
            padding: 20px;
            border: 1px solid black;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h2>Employee Details</h2>

    <form>
        <label>Employee Name:</label>
        <input type="text" id="employeeNam " placeholder="Enter the name">

        <label>Department:</label>
        <input type="text" id="department" placeholder="Enter the department">

        <label>Salary:</label>
        <input type="number" id="salary" placeholder="Enter the salary">

        <button type="button" onclick="addEmployee()">Add Employee</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody id="employeeTable">
        </tbody>
    </table>

    <script src="assets/js/index.js"></script>

</body>
</html>
